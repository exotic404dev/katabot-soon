
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>katabot - Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Background image with subtle zoom animation */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('YOUR_IMAGE_OR_GIF_HERE'); /* Put your image file name or link here */
            background-size: cover;
            background-position: center;
            animation: moveBackground 20s linear infinite alternate;
            z-index: -1;
        }

        @keyframes moveBackground {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            background: rgba(0, 0, 0, 0.4); /* Dark overlay for readability */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            margin-bottom: 20px;
            color: #cccccc;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        p {
            color: #dddddd;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #ffffff;
            color: #0b0b0b;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <div class="card">
            <div class="badge">Coming Soon</div>
        
            <p>Our website will be available soon. Follow us on our platforms to stay updated.</p>
            
            <div class="social-links">
                <a href="https://github.com" target="_blank" class="btn">GitHub</a>
                <a href="https://discord.com" target="_blank" class="btn">Discord</a>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katabot.dev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0204; /* خلفية داكنة قريبة للجو الأحمر الداكن */
            font-family: Arial, sans-serif;
        }

        /* حاوية الريش المتساقط */
        .feathers-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* شكل الريشة الواحدة */
        .feather {
            position: absolute;
            top: -10%;
            background: linear-gradient(135deg, #ff1e38, #8b0000);
            border-radius: 50% 0 50% 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* حركة السقوط والتذبذب */
        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* محتوى الموقع (مثلاً العنوان أو اسمك) */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- الريش المتساقط -->
